{id:156,o:'moz',c:C7,t:'mc',q:'他のサイトの記事で自社名が紹介されているのに、自社サイトへのリンクがない。適切な対応はどれ？',ch:['掲載元に連絡し、リンクを追加してもらえないか丁寧に相談する','謝礼を払ってリンクを張ってもらう','掲載元の記事のコメント欄に自社サイトの URL を書き込む','できることはないので放置する'],a:0,
 e:'自社やコンテンツについて言及しているのにリンクがないケースはよくあります。Moz は、こうした言及を検索で見つけ、掲載元にリンクの追加を相談することを、リンク獲得の方法として紹介しています。すでに好意的に紹介してくれている相手なので、依頼が受け入れられやすいのが特徴です。',
 why:{1:'リンクの対価として金銭を払うのはリンクの購入にあたり、ガイドライン違反です。',2:'コメント欄に自分で書き込んだリンクは、スパム扱いされやすく、評価もされません。',3:'相談すればリンクを追加してもらえることも多く、手軽なリンク獲得の機会です。'},
 p:'自社名やサービス名を引用符付きで検索したり、言及を検知するツールを使ったりすると、こうした機会を定期的に見つけられます。',s:'m6'},
{id:157,o:'moz',c:C7,t:'mc',q:'リンク獲得の方法として、推奨されないものはどれ？',ch:['被リンクを販売している業者からリンクを買う','独自の調査データをまとめて公開する','他サイトのリンク切れを見つけ、代わりになる自社ページを紹介する','業界の信頼できるメディアに、有益な記事を寄稿する'],a:0,
 e:'リンクの購入は、物品やサービスとの交換も含めてガイドライン違反で、発覚すると大幅な順位低下につながるおそれがあります。一方、独自データの公開、リンク切れの代わりになるページの紹介（ブロークンリンクビルディング）、信頼できる媒体への寄稿は、Moz が紹介している正当な方法です。',
 why:{1:'引用したくなる独自データは、自然な被リンクを集めやすいコンテンツです。',2:'相手のサイトの問題を解決する提案なので、正当な方法です。',3:'質の高い媒体への寄稿は正当です。ただし、リンク獲得だけを目的にした低品質な寄稿記事の量産は避けるべきとされています。'},
 p:'リンクの購入は「記事掲載パッケージ」など、表現を変えて提案されることもあります。対価と引き換えにリンクが付くなら、リンクの購入と同じです。',s:'m6'},

// ── 調査・分析
{id:160,o:'moz',c:C4,t:'mc',q:'Search Console に表示される「CTR（クリック率）」の説明として正しいものはどれ？',ch:['検索結果に表示された回数のうち、クリックされた割合','サイトを訪れた人のうち、問い合わせや購入をした割合','ページを見た人のうち、他のページを見ずに離脱した割合','ページがクロールされた頻度'],a:0,
 e:'CTR（Click Through Rate）は、検索結果に表示された回数（表示回数）のうち、実際にクリックされた割合です。順位が同じでも、タイトルやスニペットの魅力によって CTR は変わるため、title や meta description の改善効果を測る指標として使われます。',
 why:{1:'コンバージョン率の説明です。',2:'直帰率の説明です。',3:'クロールの頻度は CTR とは関係ありません。'},
 p:'Search Console の検索パフォーマンスで、表示回数が多いのに CTR が低いページは、タイトルやディスクリプションの改善候補になります。',s:'m7'},
{id:161,o:'moz',c:C4,t:'mc',q:'SEO の目標（KPI）を決めるとき、Moz がまず考えるよう勧めているものはどれ？',ch:['問い合わせ数や売上など、事業の成果につながる指標','狙ったキーワードの検索順位','サイト全体のアクセス数','Moz のドメインオーソリティ'],a:0,
 e:'Moz は、順位やアクセス数は目的を達成するための手段であって、それ自体が最終目標ではないと述べています。たとえば、月1,000人が訪れて3人しか問い合わせない状態より、月300人で40人が問い合わせる状態の方が事業には価値があります。まず事業の目標を決め、その達成に SEO を使う、という順番が大切です。',
 why:{1:'順位は重要な指標ですが、クリックされなければ成果になりません。手段の一つです。',2:'アクセス数が増えても、事業の成果につながらなければ意味がありません。',3:'ツール独自の目安で、事業の成果そのものではありません。'},
 p:'提案の最初に「このサイトの主要な KPI は〇〇」と合意しておくと、施策の優先順位も、効果報告の軸もぶれなくなります。',s:'m1'},
{id:162,o:'moz',c:C4,t:'mc',q:'飲食店サイトをリニューアルしたら、トップページの直帰率が上がった。まず考えるべきことはどれ？',ch:['営業時間や住所を見てそのまま来店している可能性もあるので、予約や電話などの成果と合わせて確認する','ページの質が下がったので、元のデザインに戻す','直帰率を下げるために、内容を複数のページに分けて回遊させる','検索順位が下がる前に、すぐに文章を書き直す'],a:0,
 e:'直帰は、1ページだけ見てサイトを離れた訪問のことです。Moz は、リニューアル後に直帰率が上がったレストランのサイトが、実は以前より成果を出していた例を挙げています。訪問者は営業時間やメニュー、住所を確認して、そのまま来店していたのです。直帰率だけでは、ページが役に立ったかどうかは分かりません。ページの目的によっては、1ページで用が済むのはむしろ良いことです。',
 why:{1:'直帰率が上がっただけで質が下がったとは判断できません。成果が増えているなら、戻すと逆効果になります。',2:'目的の情報にたどり着きにくくなるだけで、訪問者のためになりません。数字を下げること自体が目的になってしまっています。',3:'直帰率が検索順位を直接決めるわけではありません。原因を確かめる前に書き直すのは早すぎます。'},
 p:'直帰率は、ページの目的と合わせて見ます。飲食店なら予約数や電話のタップ数、記事ならスクロールの深さなど、そのページで達成したいことに合った指標を併用します。',s:'m7'},
{id:163,o:'moz',c:C4,t:'mc',q:'URL の末尾に `?utm_source=newsletter&utm_medium=email` のようなパラメータを付ける目的はどれ？',ch:['アクセス解析で、どの施策・媒体から来た訪問かを計測するため','検索順位を上げるため','ページを検索結果に表示させないため','ページの表示速度を上げるため'],a:0,
 e:'これは UTM パラメータと呼ばれ、流入元（source）、媒体（medium）、キャンペーン名（campaign）などを URL に付けておくことで、Google アナリティクスなどの解析ツールで、どの施策から来た訪問かを区別できるようにするものです。',
 why:{1:'UTM パラメータは計測用で、順位には関係しません。',2:'検索結果から除外するのは noindex の役割です。',3:'表示速度には関係しません。'},

const SEGS=[['https://','scheme','プロトコル'],['www.','sub','サブドメイン'],['example.com','domain','ドメイン'],['/pets/','dir','ディレクトリ'],['cats.html','file','ファイル名'],['?sort=price','param','パラメータ'],['#reviews','frag','フラグメント']];
function figUrl(hl){
  const on=k=>hl===k||(hl==='path'&&(k==='dir'||k==='file'))||(hl==='host'&&(k==='sub'||k==='domain'));
  return `<div class="urlfig" role="img" aria-label="URL の各部分の名前"><div class="segs">${SEGS.map(([t,k,l])=>`<div class="seg${on(k)?' on':''}"><code>${esc(t)}</code><span>${l}</span></div>`).join('')}</div>`+
  `<ul class="groups"><li${hl==='host'?' class="on"':''}><b>ホスト名</b> <code>www.example.com</code>（サブドメイン＋ドメイン）</li><li${hl==='path'?' class="on"':''}><b>パス</b> <code>/pets/cats.html</code>（ディレクトリ＋ファイル名）</li><li${hl==='tld'?' class="on"':''}><b>TLD</b> <code>.com</code>（ドメインの末尾）</li></ul></div>`;
}
function figHtml(q){return q.fig==='url'?figUrl(q.hl):''}
function whyHtml(q){if(!q.why)return '';return `<div class="lbl">他の選択肢が違う理由</div><ul class="why">${Object.entries(q.why).map(([k,r])=>`<li><b>${fmt(q.ch[k])}</b><span>${fmt(r)}</span></li>`).join('')}</ul>`}

];
function glossFor(q){const text=[q.q,...(q.ch||[]),q.e,q.p].join(' ');return G.filter(g=>g[1].some(p=>text.includes(p)))}
function glossHtml(list){return '<dl class="gl">'+list.map(g=>`<div><dt>${esc(g[0])}</dt><dd>${esc(g[2])}</dd></div>`).join('')+'</dl>'}
function glossBlock(q,open){const l=glossFor(q);if(!l.length)return '';return `<details class="gloss"${open?' open':''}><summary>この問題に出てくる用語（${l.length}）</summary>${glossHtml(l)}</details>`}

const KEY='seo-kiso-drill.v1';
const qById=Object.fromEntries(Q.map(x=>[x.id,x]));
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.rounds))return Object.assign({seen:{},weak:[]},s)}catch(e){}return{rounds:[],seen:{},weak:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
let store=load();
store.weak=store.weak.filter(id=>qById[id]);

const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function crumb(u){return u.replace(/^https:\/\//,'').replace(/\?.*$/,'').split('/').filter(Boolean).join(' › ')}
function choiceLabels(q){return q.t==='tf'?['○ 正しい','× 誤り']:q.ch}
function srcHtml(q){const [u,t]=S[q.s];return `<a class="src" href="${u}" target="_blank" rel="noopener"><span class="crumb">${esc(crumb(u))}</span><span class="st">${esc(t)}</span></a>`}
function detailHtml(q,open){return `<div class="lbl">解説</div><p class="exp">${fmt(q.e)}</p>${figHtml(q)}${whyHtml(q)}<div class="tip"><div class="lbl">実務のポイント</div><p>${fmt(q.p)}</p></div>${glossBlock(q,!!open)}${srcHtml(q)}`}
$('glCount').textContent=G.length;
$('glAll').innerHTML=`<div class="lbl" style="margin-top:14px">URL の各部分の呼び方</div>${figUrl('')}`+glossHtml(G);

// category chips
const catBox=$('cats');
CATS.forEach((c,i)=>{catBox.insertAdjacentHTML('beforeend',`<label class="chip"><input type="checkbox" id="cat${i}" value="${esc(c)}" checked><span>${esc(c)}（<span id="cn${i}"></span>）</span></label>`)});
function selectedCats(){return CATS.filter((c,i)=>$('cat'+i).checked)}
const org=q=>q.o||'google';
function selOrigins(){const o=[];if($('srcG').checked)o.push('google');if($('srcM').checked)o.push('moz');return o}
function perRound(){return 15}
catBox.addEventListener('change',refreshStart);
$('catAll').addEventListener('click',()=>{CATS.forEach((c,i)=>$('cat'+i).checked=true);refreshStart()});
$('catNone').addEventListener('click',()=>{CATS.forEach((c,i)=>$('cat'+i).checked=false);refreshStart()});
$('srcs').addEventListener('change',refreshStart);

let round=null;
function show(id){['start','glossary','history','play','result'].forEach(s=>$(s).hidden=!(id==='start'?(s==='start'||s==='glossary'||s==='history'):s===id));window.scrollTo(0,0)}

function refreshStart(){
  const cats=selectedCats(),origins=selOrigins();
  CATS.forEach((c,i)=>{$('cn'+i).textContent=Q.filter(q=>q.c===c&&origins.includes(org(q))).length});
  $('nG').textContent=Q.filter(q=>org(q)==='google').length;
  $('nM').textContent=Q.filter(q=>org(q)==='moz').length;
  const poolN=Q.filter(q=>cats.includes(q.c)&&origins.includes(org(q))).length;
  $('go').disabled=poolN===0;
  const pi=$('poolInfo');
  if(poolN===0){pi.className='pool warn';pi.textContent=!cats.length?'カテゴリを1つ以上選んでください。':!origins.length?'出典を1つ以上選んでください。':'この組み合わせに当てはまる問題がありません。'}
  else{pi.className='pool';pi.innerHTML=`選んだ範囲の <b>${poolN}</b> 問から、15問を出題します。`+(poolN<15?`（${poolN}問しかないため、${poolN}問で出題します）`:'')}
  const weak=store.weak.length;
  $('goWeak').disabled=weak===0;
  $('goWeak').textContent=weak?`間違えた問題を復習（${weak}問）`:'間違えた問題を復習';
  const seenCount=Object.keys(store.seen).filter(id=>qById[id]).length;
  const tot=store.rounds.reduce((a,r)=>a+r.total,0),cor=store.rounds.reduce((a,r)=>a+r.score,0);
  $('stats').innerHTML=`<span>問題数 <b>${Q.length}</b></span><span>出題済み <b>${seenCount}</b></span><span>通算正答率 <b>${tot?Math.round(cor/tot*100)+'%':'—'}</b></span>`;
  renderHistory();
}
function pillClass(p){return p>=80?'hi':p>=60?'mid':'lo'}
function fmtDate(t){const d=new Date(t);const z=n=>String(n).padStart(2,'0');return `${d.getMonth()+1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`}
function renderHistory(){
  const h=$('hist');
  if(!store.rounds.length){h.innerHTML='<p class="empty">まだ記録はありません。1回目を解き終えると、各回の正答率と間違えた問題がここに残ります。</p>';return}
  h.innerHTML=store.rounds.slice().reverse().map(r=>{
    const p=Math.round(r.score/r.total*100);
    const wrong=r.items.filter(i=>!i.ok&&qById[i.id]);
    const body=wrong.length?'<ul>'+wrong.map(i=>`<li>${fmt(qById[i.id].q)}</li>`).join('')+'</ul>':(r.items.some(i=>!i.ok)?'<p class="empty" style="margin:0 0 12px">この回で間違えた問題は、改訂により現在の問題集から外れています。</p>':'<p class="none">全問正解</p>');
    return `<details><summary><span class="rn">第${r.n}回${r.weak?'<br><span class="dt">復習</span>':''}</span><span class="dt">${fmtDate(r.at)}　${r.score} / ${r.total}問正解</span><span class="pill ${pillClass(p)}">${p}%</span></summary>${body}</details>`;
  }).join('');
}

function start(weakMode){
  let pool;
  if(weakMode){pool=store.weak.map(id=>qById[id]).filter(Boolean)}
  else{const cats=selectedCats(),origins=selOrigins();pool=Q.filter(q=>cats.includes(q.c)&&origins.includes(org(q)))}
  if(!pool.length)return;
  // 出題回数が少ない問題を優先し、同数ならランダム
  pool=shuffle(pool).sort((a,b)=>(store.seen[a.id]||0)-(store.seen[b.id]||0)).slice(0,perRound());
  pool=shuffle(pool);
  round={n:store.rounds.length+1,weak:!!weakMode,i:0,items:pool.map(q=>({q,order:q.t==='tf'?[0,1]:shuffle(q.ch.map((_,k)=>k)),chosen:null}))};
  show('play');renderQ();
}

function renderQ(){
  const it=round.items[round.i],q=it.q,N=round.items.length;
  $('qConfirm').hidden=true;
  $('pRound').textContent=`第${round.n}回${round.weak?'（復習）':''}`;
  $('pCount').textContent=`${round.i+1} / ${N}`;
  $('pBar').style.width=(round.i/N*100)+'%';
  $('pCat').textContent=q.c;
  $('pType').textContent=(q.t==='tf'?'○×問題':'4択問題')+'　出典：'+(org(q)==='moz'?'Moz':'Google 公式');
  $('pQ').innerHTML=fmt(q.q);
  const labels=choiceLabels(q);
  const box=$('pChoices');
  box.className='choices'+(q.t==='tf'?' tf':'');
  box.innerHTML=it.order.map((k,pos)=>`<button class="choice" id="c${pos}" data-k="${k}">${q.t==='tf'?'':`<span class="k">${pos+1}</span>`}<span class="t">${fmt(labels[k])}</span></button>`).join('');
  box.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.k)));
  $('pFb').hidden=true;
  $('next').textContent=round.i===N-1?'結果を見る':'次の問題';
}

function answer(k){
  const it=round.items[round.i];if(it.chosen!==null)return;
  it.chosen=k;const q=it.q,ok=k===q.a;
  $('pChoices').querySelectorAll('.choice').forEach(b=>{b.disabled=true;const bk=+b.dataset.k;if(bk===q.a)b.classList.add('ok');else if(bk===k)b.classList.add('ng')});
  const v=$('pVerdict');v.textContent=ok?'正解':`不正解　正解は「${choiceLabels(q)[q.a]}」`;v.className='verdict '+(ok?'ok':'ng');
  $('pDetail').innerHTML=detailHtml(q,true);
  $('pFb').hidden=false;
  $('pBar').style.width=((round.i+1)/round.items.length*100)+'%';
  $('next').focus({preventScroll:true});
}

function next(){
  if(round.items[round.i].chosen===null)return;
  if(round.i<round.items.length-1){round.i++;renderQ();window.scrollTo(0,0)}else finish();
}

function finish(){
  const items=round.items.map(it=>({id:it.q.id,chosen:it.chosen,ok:it.chosen===it.q.a}));
  const score=items.filter(i=>i.ok).length,total=items.length;
  items.forEach(i=>{store.seen[i.id]=(store.seen[i.id]||0)+1;
    if(i.ok)store.weak=store.weak.filter(x=>x!==i.id);else if(!store.weak.includes(i.id))store.weak.push(i.id)});
  store.rounds.push({n:round.n,at:Date.now(),score,total,weak:round.weak,items});
  save();
  const p=Math.round(score/total*100);
  $('rRound').textContent=`第${round.n}回の結果${round.weak?'（復習）':''}`;
  $('rPct').textContent=p+'%';$('rPct').style.color=`var(--${p>=80?'good':p>=60?'accent':'bad'})`;
  $('rFrac').textContent=`${total}問中 ${score}問正解`;
  $('rMsg').textContent=p===100?'全問正解です。別のカテゴリにも挑戦してみましょう。':p>=80?'よくできています。間違えた問題の実務のポイントと出典ページを読んでおくと定着します。':p>=60?'基本は押さえられています。間違えた問題は「復習」でもう一度出題できます。':'間違えた問題の解説と出典ページを確認してから、復習モードで再挑戦しましょう。';
  $('rList').innerHTML=round.items.map((it,idx)=>{const q=it.q,ok=it.chosen===q.a,L=choiceLabels(q);
    return `<li class="item ${ok?'ok':'ng'}"><span class="mk">${ok?'○':'×'}</span><div class="body"><div class="q">Q${idx+1}. ${fmt(q.q)}</div>`+
      (ok?`<div class="ans"><span class="c">正解：<b>${fmt(L[q.a])}</b></span></div><details><summary>解説を見る</summary>${detailHtml(q)}</details>`:
      `<div class="ans"><span class="y">あなたの回答：<b>${fmt(L[it.chosen])}</b></span>　<span class="c">正解：<b>${fmt(L[q.a])}</b></span></div>${detailHtml(q)}`)+
      `</div></li>`}).join('');
  $('again').textContent=`次の${perRound()}問へ`;
  const w=store.weak.length;
  $('againWeak').disabled=w===0;$('againWeak').textContent=w?`間違えた問題を復習（${w}問）`:'間違えた問題を復習';
  round=null;show('result');
}

$('go').addEventListener('click',()=>start(false));
$('goWeak').addEventListener('click',()=>start(true));
$('next').addEventListener('click',next);
$('again').addEventListener('click',()=>start(false));
$('againWeak').addEventListener('click',()=>start(true));
$('home').addEventListener('click',()=>{refreshStart();show('start')});
// 途中でやめる・やり直す（この回の回答は記録しない）
let pending=null;
function ask(kind){
  const answered=round.items.filter(it=>it.chosen!==null).length;
  if(answered===0){doCtl(kind);return}
  pending=kind;
  $('qConfirmMsg').textContent=(kind==='home'?'トップに戻りますか？':'この回を1問目からやり直しますか？')+`回答済みの${answered}問は記録されません。`;
  $('qYes').textContent=kind==='home'?'トップに戻る':'最初からやり直す';
  $('qConfirm').hidden=false;$('qYes').focus();
}
function doCtl(kind){
  $('qConfirm').hidden=true;pending=null;
  if(kind==='home'){round=null;refreshStart();show('start')}
  else{round.i=0;round.items.forEach(it=>{it.chosen=null;if(it.q.t!=='tf')it.order=shuffle(it.order)});renderQ();window.scrollTo(0,0)}
}
$('qRestart').addEventListener('click',()=>ask('restart'));
$('qHome').addEventListener('click',()=>ask('home'));
$('qYes').addEventListener('click',()=>doCtl(pending));
$('qNo').addEventListener('click',()=>{$('qConfirm').hidden=true;pending=null});
document.addEventListener('keydown',e=>{
  if(!round||$('play').hidden)return;
  const it=round.items[round.i];
  if(it.chosen===null&&/^[1-4]$/.test(e.key)){const b=$('c'+(+e.key-1));if(b)b.click()}
  else if(it.chosen!==null&&e.key==='Enter'&&document.activeElement!==$('next')){next()}
});
refreshStart();
</script>
</body>
</html>
